{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aap-operator.fullname" . }}
  namespace: {{ include "aap-operator.namespace" . }}
  labels:
    {{- include "aap-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aap-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aap-operator.serviceAccountName" . }}
    namespace: {{ include "aap-operator.namespace" . }}
{{- end }}
