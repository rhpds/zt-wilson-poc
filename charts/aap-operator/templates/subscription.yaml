---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ include "aap-operator.fullname" . }}
  namespace: {{ include "aap-operator.namespace" . }}
  labels:
    {{- include "aap-operator.labels" . | nindent 4 }}
    {{- with .Values.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  channel: {{ .Values.operator.channel | quote }}
  installPlanApproval: {{ .Values.operator.installPlanApproval }}
  name: ansible-automation-platform-operator
  source: {{ .Values.operator.source }}
  sourceNamespace: {{ .Values.operator.sourceNamespace }}
  {{- if .Values.operator.startingCSV }}
  startingCSV: {{ .Values.operator.startingCSV | quote }}
  {{- end }}
