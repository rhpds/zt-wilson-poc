---
# NetworkPolicy configuration for AAP deployment
# Defines allowed ingress (incoming) and egress (outgoing) traffic

# Ingress: Allow incoming connections to AAP services
ingress:
  # Allow HTTP/HTTPS traffic from anywhere (for AAP web UI access)
  - from:
      - ipBlock:
          cidr: 0.0.0.0/0
    ports:
      - protocol: TCP
        port: 80
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 8080

  # Allow database connections within namespace (AAP pods → PostgreSQL/Redis)
  - from:
      - podSelector: {}  # Any pod in this namespace
    ports:
      - protocol: TCP
        port: 5432  # PostgreSQL
      - protocol: TCP
        port: 6379  # Redis

# Egress: Allow outgoing connections from pods
egress:
  # DNS for service discovery
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-dns
    ports:
      - protocol: UDP
        port: 5353
      - protocol: TCP
        port: 5353

  # PostgreSQL database connections within namespace
  - ports:
      - protocol: TCP
        port: 5432

  # Redis connections within namespace
  - ports:
      - protocol: TCP
        port: 6379

  # CRITICAL: Kubernetes API access for operator pods
  # Without this, operator reconciliation fails with connection timeouts
  # Operator needs to query CRDs, create resources, watch events
  - to:
      - ipBlock:
          cidr: 0.0.0.0/0
    ports:
      - protocol: TCP
        port: 6443  # Kubernetes API server

  # HTTPS for external connections (package downloads, container registries, etc.)
  - ports:
      - protocol: TCP
        port: 443

  # HTTP for external connections (if needed)
  - ports:
      - protocol: TCP
        port: 80
