---
# Helm charts to deploy in this lab environment
# This file is read by ocp4_workload_helm_from_content_repo

charts:
  # Ansible Automation Platform 2.7
  - name: aap
    enabled: true
    source:
      type: path
      path: charts/aap-operator  # AAP Helm chart in content repo

    release:
      name: aap
      values:
        # Operator already installed by ocp4_workload_install_operator
        operator:
          install: false

        # Admin credentials
        admin:
          password: "{{ common_password }}"

        # Component configuration
        controller:
          enabled: true
        hub:
          enabled: false
        eda:
          enabled: false
        lightspeed:
          enabled: false

        # Critical timeout fix for gateway initialization
        # Prevents uWSGI HARAKIRI timeout on discovery endpoints
        # Reference: Red Hat Solution 7141796
        route_annotations:
          haproxy.router.openshift.io/timeout: "300s"

    security:
      allowClusterScopedResources: false  # No cluster-wide resources
      allowPrivileged: false              # No privileged containers
      allowHostPath: false                # No host path volumes
      maxCpuLimit: 2000m                  # Controller web/task pod limit
      maxMemoryLimit: 4Gi                 # Controller web/task pod limit
      maxStorageClaim: 10Gi               # PostgreSQL PVC

    wait:
      enabled: true
      timeout: 900  # 15 minutes for operator reconciliation + migrations
